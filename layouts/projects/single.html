{{ define "main" }}
<div class="container">
<article class="page">
  <a class="back reveal in" href="{{ (site.GetPage "/projects").RelPermalink }}">{{ i18n "backToProjects" }}</a>
  <div class="reveal in d1">
    <span class="tag tag-{{ .Params.status | urlize }}">{{ .Params.status }}</span>
    <h1>{{ .Title }}</h1>
    <table class="meta-table">
      <tr><th>{{ i18n "funder" }}</th><td>{{ .Params.funder }}</td></tr>
      <tr><th>{{ i18n "period" }}</th><td>{{ .Params.start }} – {{ .Params.end }}</td></tr>
      {{ with .Params.pi }}<tr><th>{{ i18n "principalInvestigator" }}</th><td>{{ . }}</td></tr>{{ end }}
    </table>
  </div>
  <div class="prose reveal in d2">{{ .Content }}</div>
</article>
</div>
{{ end }}
